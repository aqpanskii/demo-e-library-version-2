<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Электронная библиотека Кітап</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: sticky top bar · library grid of generated "spine" covers · book page with cover + tabs · focused reading column with a floating translation card · admin as a two-tab workbench */
/* Soft cards direction: warm-grey canvas, white 20px cards, pastel icon discs, outlined pill buttons */
:root{
  --paper:#EFEEEC; --surface:#FFFFFF; --sunk:#F6F5F3; --ink:#141A2E; --muted:#6B7080; --line:#E6E3DF;
  --accent:#2F5FE3; --accent-strong:#1F48C2; --on-accent:#FFFFFF; --accent-soft:#E3EAFE;
  --gold:#E0A100; --gold-soft:#FFF3C4; --ok:#14935F; --ok-soft:#DDF6EA; --bad:#D63A3A; --bad-soft:#FDE4E4;
  --btn-dark:#141A2E; --on-dark:#FFFFFF;
  --y-bg:#FFF4C4; --y-fg:#E0A100; --o-bg:#FFE3D1; --o-fg:#F05F0C; --p-bg:#FFDDE9; --p-fg:#E2185C;
  --v-bg:#EEE4FF; --v-fg:#7C3AED; --b-bg:#DFE8FF; --b-fg:#2F5FE3; --c-bg:#D7F5FA; --c-fg:#0891B2; --m-bg:#D8F6E7; --m-fg:#0E9F6E;
  --shadow:0 1px 2px rgba(20,26,46,.04),0 8px 28px rgba(20,26,46,.06);
  --f-display:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-read:'Literata',Georgia,'Times New Roman',serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121316; --surface:#1C1D22; --sunk:#24262C; --ink:#EEF0F5; --muted:#9A9EAB; --line:#2E3038;
  --accent:#7C9DFF; --accent-strong:#A3BAFF; --on-accent:#0E1430; --accent-soft:#232C4A;
  --gold:#F5C542; --gold-soft:#3A3115; --ok:#4CD39A; --ok-soft:#173527; --bad:#FF7A7A; --bad-soft:#3F1D1D;
  --btn-dark:#EEF0F5; --on-dark:#141A2E;
  --y-bg:#3A3215; --y-fg:#F5C542; --o-bg:#3D2516; --o-fg:#FF8F4D; --p-bg:#3D1A28; --p-fg:#FF6B9C;
  --v-bg:#2D2245; --v-fg:#B794FF; --b-bg:#1F2A4D; --b-fg:#7C9DFF; --c-bg:#14343B; --c-fg:#4FD1E8; --m-bg:#16362A; --m-fg:#4CD39A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121316; --surface:#1C1D22; --sunk:#24262C; --ink:#EEF0F5; --muted:#9A9EAB; --line:#2E3038;
  --accent:#7C9DFF; --accent-strong:#A3BAFF; --on-accent:#0E1430; --accent-soft:#232C4A;
  --gold:#F5C542; --gold-soft:#3A3115; --ok:#4CD39A; --ok-soft:#173527; --bad:#FF7A7A; --bad-soft:#3F1D1D;
  --btn-dark:#EEF0F5; --on-dark:#141A2E;
  --y-bg:#3A3215; --y-fg:#F5C542; --o-bg:#3D2516; --o-fg:#FF8F4D; --p-bg:#3D1A28; --p-fg:#FF6B9C;
  --v-bg:#2D2245; --v-fg:#B794FF; --b-bg:#1F2A4D; --b-fg:#7C9DFF; --c-bg:#14343B; --c-fg:#4FD1E8; --m-bg:#16362A; --m-fg:#4CD39A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
::selection{background:var(--gold-soft);color:var(--ink)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.langpick{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
@media (max-width:720px){.nav{margin-left:0;order:3;width:100%}.langpick{margin-left:auto}}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;letter-spacing:.03em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:9px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:13px}
.field .hint{color:var(--muted);font-size:12.5px}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.02em}
.chip.accent{background:var(--accent-soft);color:var(--accent-strong)}
main{padding-block:28px 64px}

/* library */
.lib-head{display:grid;grid-template-columns:1fr auto;gap:20px 32px;align-items:end;margin-bottom:28px}
.lib-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.01em}
.lib-head p{color:var(--muted);max-width:56ch;margin:10px 0 0}
.search{position:relative;width:min(340px,100%)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}
@media (max-width:720px){.lib-head{grid-template-columns:1fr}.search{width:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit}
.card:hover .cover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.12),0 18px 34px rgba(0,0,0,.18)}
.card h3{font-family:var(--f-read);font-weight:600;font-size:18px;line-height:1.25}
.card .by{color:var(--muted);font-size:13.5px;margin-top:2px}
.card .desc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.card .chips{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* covers */
.cover{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 22px rgba(0,0,0,.14);transition:transform .25s ease,box-shadow .25s ease;background:#333}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{display:flex;flex-direction:column;justify-content:space-between;padding:16% 12% 12% 16%;color:#F6F1E4}
.cover.gen::before{content:"";position:absolute;inset:0 auto 0 0;width:7%;background:rgba(0,0,0,.22);box-shadow:1px 0 0 rgba(255,255,255,.12)}
.cover.gen::after{content:"";position:absolute;left:16%;right:12%;top:52%;height:14%;opacity:.35;background:
  radial-gradient(circle at 50% 50%,transparent 38%,currentColor 39%,currentColor 44%,transparent 45%) 0 0/28px 28px repeat-x}
.cover .ct{position:relative;font-family:var(--f-read);font-weight:600;font-size:clamp(15px,1.7vw,19px);line-height:1.2;text-wrap:balance}
.cover .ca{position:relative;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cover .cy{position:relative;font-family:var(--f-display);font-size:10px;opacity:.6;margin-top:4px}

/* book page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:20px}
.back:hover{color:var(--ink)}
.book-head{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:start;margin-bottom:26px}
.book-head .cover{width:170px}
.book-head h1{font-family:var(--f-read);font-weight:600;font-size:clamp(26px,3.6vw,36px);line-height:1.15}
.book-head .by{color:var(--muted);font-size:16px;margin-top:6px}
.book-head p{max-width:62ch;margin:14px 0 0}
.book-head .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
@media (max-width:600px){.book-head{grid-template-columns:110px 1fr;gap:16px}.book-head .cover{width:110px}.book-head p{grid-column:1/-1}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{background:var(--sunk);border-radius:999px;padding:1px 8px;font-size:12px}

/* reader */
.reader{display:grid;gap:16px}
.reader-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.tip{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border-radius:9px;padding:9px 13px;font-size:13.5px}
.tip mark{background:var(--gold);color:#1b1608;padding:0 4px;border-radius:3px}
.fontctl{display:flex;gap:4px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(22px,5vw,56px) clamp(18px,6vw,72px);box-shadow:var(--shadow)}
.reader-text{max-width:64ch;margin:0 auto;font-family:var(--f-read);line-height:1.75;font-size:var(--rs,18px);hyphens:auto}
.reader-text p{margin:0 0 1.05em;text-indent:1.4em}
.reader-text p:first-child{text-indent:0}
.reader-text p:first-child::first-letter{font-family:var(--f-display);font-weight:700;color:var(--accent);float:left;font-size:3.1em;line-height:.9;padding:.08em .1em 0 0}
.reader-text.cont p:first-child::first-letter{all:unset}
.reader-text.cont p:first-child{text-indent:1.4em}
.reader-text::selection,.reader-text *::selection{background:var(--gold);color:#1b1608}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager .pos{display:flex;align-items:center;gap:8px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.pager .pos input{width:64px;text-align:center;padding:7px}
.progress{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* translation popover */
.pop{position:absolute;z-index:50;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.08),0 24px 48px rgba(0,0,0,.18);padding:14px 16px 12px;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cover{transition:none}}
.pop-src{font-family:var(--f-read);font-style:italic;color:var(--muted);font-size:14px;max-height:4.5em;overflow:auto;padding-right:24px}
.pop-res{font-family:var(--f-read);font-size:20px;font-weight:600;line-height:1.3;margin:6px 0 2px;min-height:1.3em}
.pop-res.small{font-size:15px;font-weight:400}
.pop-gloss{display:grid;gap:3px;font-size:13.5px;margin-top:6px}
.pop-gloss div{display:flex;gap:8px}
.pop-gloss b{font-weight:600}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pop-meta{font-size:11.5px;color:var(--muted)}
.pop-x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:7px;font-size:18px;line-height:1}
.pop-x:hover{background:var(--sunk);color:var(--ink)}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:d 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* tasks & tests */
.tasks-layout{display:grid;gap:32px;max-width:780px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-title h2{font-family:var(--f-display);font-weight:500;font-size:18px}
.task-list{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:t}
.task-list li{counter-increment:t;display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.task-list li::before{content:counter(t);font-family:var(--f-display);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.task-list p{margin:3px 0 0;min-width:0}
.test{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.test-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.test-head h3{font-size:16.5px;font-weight:600}
.test-head .meta{color:var(--muted);font-size:13px}
.q{padding:18px 20px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-text{font-weight:600;margin-bottom:10px;display:flex;gap:10px}
.q-text span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt input{accent-color:var(--accent);margin:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mark{margin-left:auto;font-size:12.5px;font-weight:600}
.opt.right .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.test-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--sunk);flex-wrap:wrap}
.score{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-variant-numeric:tabular-nums}
.score strong{display:block;font-size:16px}
.score small{color:var(--muted)}

/* admin */
.admin-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.admin-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,32px)}
.admin-head p{color:var(--muted);margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h2{font-size:17px;font-weight:600;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;color:var(--muted)}
.tcell{display:flex;align-items:center;gap:12px}
.tcell .cover{width:38px;flex:none;border-radius:2px 5px 5px 2px;padding:0}
.tcell .cover .ct,.tcell .cover .ca,.tcell .cover .cy{display:none}
.tcell .cover::after{display:none}
.tcell b{display:block;font-weight:600}
.tcell span{color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px;justify-content:flex-end}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--paper);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop .ico{width:40px;height:40px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--line)}
.drop b{display:block;font-weight:600;font-size:14px}
.drop span{color:var(--muted);font-size:12.5px;word-break:break-word}
.form-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:18px}
.status{font-size:13px;color:var(--muted);margin-right:auto}
.status.err{color:var(--bad)}
.stack{display:grid;gap:22px}
.admin-items{display:grid;gap:8px;margin-bottom:16px}
.admin-item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.admin-item .txt{min-width:0}
.admin-item .txt b{display:block;font-weight:600}
.admin-item .txt span{color:var(--muted);font-size:13px}
.admin-item .txt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.qb{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--paper)}
.qb-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qb-head b{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

function palOf(h){let best='b',d=999;PAL.forEach(([k,v])=>{const x=Math.min(Math.abs(h-v),360-Math.abs(h-v));if(x<d){d=x;best=k}});return best}
function coverHTML(b){

  const h=(b.cover&&b.cover.hue)??(([...b.title].reduce((a,c)=>a+c.charCodeAt(0),0))%360);
  const k=palOf(h);
  return `<div class="cover gen" style="background:var(--${k}-bg);--cov-fg:var(--${k}-fg)" role="img" aria-label="Обложка: ${esc(b.title)}"><span class="cv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.book}</svg></span><div class="ct">${esc(b.title)}</div><div><div class="ca">${esc(b.author)}</div>${b.year?`<div class="cy">${esc(b.year)}</div>`:''}</div></div>`;
}
function paginate(paras,limit=1250){
  const units=[];
  paras.forEach(p=>{if(p.length<=limit*1.3){units.push(p);return}
    const sents=p.match(/[^.!?…]+[.!?…]+["”»)]*\s*|.+$/g)||[p];let cur='';
    sents.forEach(s=>{if((cur+s).length>limit&&cur){units.push(cur.trim());cur=''}cur+=s});if(cur.trim())units.push(cur.trim())});
  const pages=[];let cur=[],len=0;
  units.forEach(u=>{if(len+u.length>limit&&cur.length){pages.push(cur);cur=[];len=0}cur.push(u);len+=u.length});
  if(cur.length)pages.push(cur);return pages.length?pages:[['(пустая книга)']];
}

/* in-page router: renders immediately on click instead of waiting for the frame's hashchange */
let curPath=(location.hash||'').replace(/^#\/?/,'');
function go(path){
  path=String(path).replace(/^#?\/?/,'');
  const same=path===curPath;curPath=path;
  try{history.replaceState(null,'','#/'+path)}catch(e){}
  route();if(!same)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');if(!a||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();go(a.getAttribute('href'));
});
function route(){
  hidePop();
  const h=curPath.split('/');
  $$('#nav a').forEach(a=>a.classList.toggle('on',(h[0]==='admin')===(a.dataset.nav==='admin')));
  if(h[0]==='book'&&book(h[1]))return renderBook(book(h[1]),h[2]==='tasks'?'tasks':'read');
  if(h[0]==='admin')return renderAdmin(h[1]||'books');

}

/* ---------- translation popover ---------- */
let currentBook=null,popState=null,popEl=null,selT;
const tCache=new Map();
document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(onSel,280)});
function onSel(){
  const rt=$('#rt');if(!rt)return;
  const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount)return;
  const r=s.getRangeAt(0);if(!rt.contains(r.commonAncestorContainer))return;
  const text=s.toString().replace(/\s+/g,' ').trim();
  if(!text||text.length>220||!/\p{L}/u.test(text))return;
  if(popState&&popState.text===text)return;
  const rect=r.getBoundingClientRect();
  showPop(text,rect);
}
function showPop(text,rect){
  hidePop();
  popState={text,from:currentBook?currentBook.lang:'en'};
  popEl=document.createElement('div');popEl.className='pop';popEl.setAttribute('role','dialog');popEl.setAttribute('aria-label','Перевод');
  popEl.innerHTML=`<button class="pop-x" aria-label="Закрыть">×</button>
    <div class="pop-src"></div><div class="pop-res" aria-live="polite"></div><div class="pop-gloss"></div>
    <div class="pop-foot"><span class="pop-meta"></span><div class="seg" role="group" aria-label="Язык перевода">${LANGS.map(l=>`<button type="button" data-l="${l.code}">${l.label}</button>`).join('')}</div></div>`;
  $('.pop-src',popEl).textContent='«'+text+'»';
  document.body.appendChild(popEl);
  const w=popEl.offsetWidth,vw=document.documentElement.clientWidth;
  let left=rect.left+rect.width/2-w/2+window.scrollX;left=Math.max(16+window.scrollX,Math.min(left,vw-w-16+window.scrollX));
  let top=rect.bottom+10+window.scrollY;
  popEl.style.left=left+'px';popEl.style.top=top+'px';
  const ph=popEl.offsetHeight;
  if(rect.bottom+ph+20>window.innerHeight&&rect.top-ph-10>0)popEl.style.top=(rect.top-ph-10+window.scrollY)+'px';
  $('.pop-x',popEl).onclick=hidePop;
  $('.seg',popEl).addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;prefs.lang=b.dataset.l;savePrefs();renderLangSeg();runTranslate()});
  runTranslate();
}
function hidePop(){if(popEl){popEl.remove();popEl=null}popState=null}
document.addEventListener('pointerdown',e=>{if(popEl&&!popEl.contains(e.target))hidePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop()});

async function runTranslate(){
  if(!popEl||!popState)return;
  const {text,from}=popState,to=prefs.lang,st=popState;
  $$('.seg [data-l]',popEl).forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===to));
  const res=$('.pop-res',popEl),gl=$('.pop-gloss',popEl),meta=$('.pop-meta',popEl);
  res.className='pop-res';gl.innerHTML='';
  if(from===to){res.className='pop-res small';res.textContent='Текст уже на этом языке. Выберите другой язык перевода.';meta.textContent=LANG_NAME[to];return}
  res.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';meta.textContent='Перевожу…';
  const out=await translate(text,from,to);
  if(st!==popState)return;
  res.className='pop-res'+(out.text&&out.text.length>40?' small':'');
  if(out.text)res.textContent=out.text;
  else{res.className='pop-res small';res.textContent=out.gloss.length?'Перевод по словам:':'Этого слова нет в демо-словаре. В рабочей версии перевод придёт из онлайн-API.'}
  gl.innerHTML=out.gloss.map(g=>`<div><b>${esc(g[0])}</b><span>— ${esc(g[1])}</span></div>`).join('');
  meta.textContent={api:'Онлайн-перевод',dict:'Словарь библиотеки',none:'Нет перевода'}[out.src]+' · '+LANG_NAME[from].slice(0,3)+' → '+LANG_NAME[to].slice(0,3);
}
function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/[’]/g,"'").replace(/[^\p{L}\p{N}\s'-]/gu,' ').replace(/\s+/g,' ').trim()}
function dictWord(w,from,to){
  const d=from==='en'?D_EN:from==='ru'?D_RU:null;if(!d)return null;
  const idx=from==='en'?(to==='ru'?0:to==='kk'?1:-1):(to==='en'?0:to==='kk'?1:-1);if(idx<0)return null;
  const tries=[w];if(from==='en'){tries.push(w.replace(/'s$/,''),w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ed$/,''),w.replace(/d$/,''),w.replace(/ing$/,''),w.replace(/ly$/,''))}
  for(const t of tries)if(d[t])return d[t][idx];return null;
}
async function translate(text,from,to){
  const key=from+'|'+to+'|'+text;if(tCache.has(key))return tCache.get(key);
  const n=norm(text),words=n.split(' ');
  const ph=PHRASES[from]&&PHRASES[from][n];
  let out=null;
  if(ph){const idx=from==='en'?(to==='ru'?0:1):(to==='en'?0:1);out={text:ph[idx],gloss:[],src:'dict'}}
  else if(words.length===1){const w=dictWord(words[0],from,to);if(w)out={text:w,gloss:[],src:'dict'}}
  if(!out){
    const api=await apiTranslate(text,from,to);
    const gloss=words.length>1?words.map(w=>[w,dictWord(w,from,to)]).filter(g=>g[1]).slice(0,8):[];
    out=api?{text:api,gloss:[],src:'api'}:{text:'',gloss,src:gloss.length?'dict':'none'};
  }
  tCache.set(key,out);return out;
}
async function apiTranslate(text,from,to){
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),3500);
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to,{signal:ctl.signal});
    clearTimeout(t);if(!r.ok)return null;const j=await r.json();
    const s=j&&j.responseData&&j.responseData.translatedText;
    if(!s||/MYMEMORY WARNING|INVALID/i.test(s))return null;return s;
  }catch(e){return null}
}

function testEl(t){
  const el=document.createElement('form');el.className='test';el.noValidate=true;

  el.innerHTML=`<div class="test-head">${ic('check','m',1)}<div><h3>${esc(t.title)}</h3><div class="meta">${t.questions.length} ${plural(t.questions.length,'вопрос','вопроса','вопросов')}${prev?` · последний результат ${prev.s} из ${prev.n}`:''}</div></div></div>

  el.addEventListener('submit',e=>{
    e.preventDefault();
    const ans=t.questions.map((q,i)=>{const c=el.querySelector(`input[name="q${i}"]:checked`);return c?+c.value:null});
    const miss=ans.filter(a=>a===null).length;
    if(miss&&!el.dataset.force){$('[data-st]',el).textContent=`Без ответа ${miss} ${plural(miss,'вопрос','вопроса','вопросов')}. Нажмите ещё раз, чтобы всё равно завершить.`;$('[data-st]',el).classList.add('err');el.dataset.force='1';return}
    let s=0;t.questions.forEach((q,i)=>{
      $$(`input[name="q${i}"]`,el).forEach((inp,j)=>{inp.disabled=true;const lab=inp.closest('.opt');
        if(j===q.correct){lab.classList.add('right');lab.querySelector('.mark').textContent='Верно'}
        else if(ans[i]===j){lab.classList.add('wrong');lab.querySelector('.mark').textContent='Ваш ответ'}});
      if(ans[i]===q.correct)s++});
    const n=t.questions.length,pct=Math.round(s/n*100);
    prefs.results[t.id]={s,n};savePrefs();
    const verdict=pct>=85?'Отлично':pct>=60?'Хорошо':pct>=40?'Есть над чем поработать':'Перечитайте текст и попробуйте ещё раз';
    $('.test-foot',el).innerHTML=`<div class="score"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><strong>${s} из ${n} правильных</strong><small>${verdict}</small></div></div><button type="button" class="btn" data-reset>Пройти заново</button>`;

  });
  $('[data-reset]',el).onclick=()=>el.replaceWith(testEl(t));
  return el;
}

/* file parsing */
const CDN={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js',mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'};
const loaded={};function loadScript(src){return loaded[src]||(loaded[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loaded[src];rej(new Error('Не удалось загрузить модуль чтения файла. Проверьте подключение к интернету.'))};document.head.appendChild(s)}))}
const toParas=t=>t.replace(/\r/g,'').split(/\n\s*\n|\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>1);
async function parseBook(file,progress){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='txt')return{format:'TXT',paras:toParas(await file.text())};
  if(ext==='docx'){await loadScript(CDN.mammoth);const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return{format:'DOCX',paras:toParas(r.value)}}
  if(ext==='pdf'){
    await loadScript(CDN.pdf);await loadScript(CDN.pdfw);
    pdfjsLib.GlobalWorkerOptions.workerSrc=CDN.pdfw;
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const out=[];const max=Math.min(doc.numPages,400);
    for(let i=1;i<=max;i++){progress&&progress(`Читаю страницу ${i} из ${max}…`);const pg=await doc.getPage(i);const c=await pg.getTextContent();
      let lines=[],cur='',lastY=null;
      c.items.forEach(it=>{const y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>2){lines.push(cur);cur=''}cur+=it.str;lastY=y;if(it.hasEOL){lines.push(cur);cur='';lastY=null}});lines.push(cur);
      let para='';lines.map(l=>l.trim()).forEach(l=>{if(!l){if(para){out.push(para);para=''}return}if(para.endsWith('-'))para=para.slice(0,-1)+l;else para+=(para?' ':'')+l;if(/[.!?…:»”"]$/.test(l)&&l.length<60){out.push(para);para=''}});if(para)out.push(para)}
    return{format:'PDF',paras:out.map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s.length>1)};
  }
  if(ext==='epub'){
    await loadScript(CDN.zip);const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const cont=await zip.file('META-INF/container.xml')?.async('text');if(!cont)throw new Error('Файл EPUB повреждён: нет container.xml.');
    const opfPath=new DOMParser().parseFromString(cont,'application/xml').querySelector('rootfile').getAttribute('full-path');
    const base=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
    const opf=new DOMParser().parseFromString(await zip.file(opfPath).async('text'),'application/xml');
    const man={};$$('manifest > item',opf).forEach(it=>man[it.getAttribute('id')]=it.getAttribute('href'));
    const out=[];const refs=$$('spine > itemref',opf);
    for(let i=0;i<refs.length;i++){const href=man[refs[i].getAttribute('idref')];if(!href)continue;progress&&progress(`Читаю главу ${i+1} из ${refs.length}…`);
      const f=zip.file(decodeURIComponent(base+href.split('#')[0]));if(!f)continue;
      const html=new DOMParser().parseFromString(await f.async('text'),'text/html');
      $$('p,h1,h2,h3,h4,li,blockquote',html.body).forEach(n=>{if(n.querySelector('p'))return;const t=n.textContent.replace(/\s+/g,' ').trim();if(t)out.push(t)})}
    return{format:'EPUB',paras:out};
  }
  throw new Error('Этот формат не поддерживается. Загрузите PDF, EPUB, DOCX или TXT.');
}

/* admin: tasks & tests */
let adminBookId=null,builder=null;
function adminTasks(){
  if(!db.books.length){$('#adminBody').innerHTML='<div class="empty">Сначала добавьте книгу во вкладке «Книги».</div>';return}
  if(!book(adminBookId))adminBookId=db.books[0].id;
  const b=book(adminBookId);
  $('#adminBody').innerHTML=`<div class="stack">
    <div class="field" style="max-width:420px"><label for="selBook">Книга</label><select class="input" id="selBook">${db.books.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.title)} — ${esc(x.author)}</option>`).join('')}</select></div>
    <section class="panel"><div class="panel-title">${ic('list','o')}<div><h2>Текстовые задания</h2><p>Инструкции, которые читатель увидит во вкладке «Задания».</p></div></div>
      <div class="admin-items" id="taskItems"></div>
      <form id="taskForm" class="stack" style="gap:10px"><div class="field"><label for="newTask">Новое задание</label><textarea class="input" id="newTask" rows="3" placeholder="Например: выпишите из первой главы 5 слов, связанных с погодой, и переведите их"></textarea></div>
      <div class="form-actions" style="margin-top:0"><span class="status" id="tst"></span><button class="btn primary">Добавить задание</button></div></form></section>
    <section class="panel"><div class="panel-title">${ic('check','v')}<div><h2>Тесты</h2><p>Вопрос, варианты ответа и один правильный вариант.</p></div></div>
      <div class="admin-items" id="testItems"></div>
      <div id="builder"></div></section>
  </div>`;
  $('#selBook').onchange=e=>{adminBookId=e.target.value;builder=null;adminTasks()};
  drawTaskItems(b);drawTestItems(b);drawBuilder(b);
  $('#taskForm').onsubmit=e=>{e.preventDefault();const v=$('#newTask').value.trim();if(!v){$('#tst').textContent='Введите текст задания.';$('#tst').classList.add('err');return}b.tasks.push({id:uid('t'),text:v});save();$('#newTask').value='';$('#tst').textContent='';drawTaskItems(b);toast('Задание добавлено')};
}
function drawTaskItems(b){
  const box=$('#taskItems');
  box.innerHTML=b.tasks.length?b.tasks.map((t,i)=>`<div class="admin-item" data-id="${t.id}"><div class="txt" style="flex:1"><span>Задание ${i+1}</span><p>${esc(t.text)}</p></div><div class="actions"><button class="btn sm" data-ed>Изменить</button><button class="btn sm danger" data-rm>Удалить</button></div></div>`).join(''):'<div class="empty" style="padding:20px">Заданий пока нет.</div>';
  $$('.admin-item',box).forEach(row=>{const t=b.tasks.find(x=>x.id===row.dataset.id);
    $('[data-ed]',row).onclick=()=>{row.innerHTML=`<div style="flex:1;display:grid;gap:8px"><textarea class="input" id="ed-${t.id}" rows="3">${esc(t.text)}</textarea><div class="actions"><button class="btn sm ghost" data-c>Отмена</button><button class="btn sm primary" data-s>Сохранить</button></div></div>`;
      $('[data-c]',row).onclick=()=>drawTaskItems(b);$('[data-s]',row).onclick=()=>{const v=$('textarea',row).value.trim();if(v){t.text=v;save();toast('Задание обновлено')}drawTaskItems(b)}};
    armButton($('[data-rm]',row),'Точно?',()=>{b.tasks=b.tasks.filter(x=>x.id!==t.id);save();drawTaskItems(b);toast('Задание удалено')})});
}
function drawTestItems(b){
  const box=$('#testItems');
  box.innerHTML=b.tests.length?b.tests.map(t=>`<div class="admin-item" data-id="${t.id}"><div class="txt"><b>${esc(t.title)}</b><span>${t.questions.length} ${plural(t.questions.length,'вопрос','вопроса','вопросов')}</span></div><div class="actions"><button class="btn sm" data-ed>Изменить</button><button class="btn sm danger" data-rm>Удалить</button></div></div>`).join(''):'<div class="empty" style="padding:20px">Тестов пока нет.</div>';
  $$('.admin-item',box).forEach(row=>{const t=b.tests.find(x=>x.id===row.dataset.id);
    $('[data-ed]',row).onclick=()=>{builder=JSON.parse(JSON.stringify(t));drawBuilder(b);$('#builder').scrollIntoView({behavior:'smooth',block:'start'})};
    armButton($('[data-rm]',row),'Точно?',()=>{b.tests=b.tests.filter(x=>x.id!==t.id);if(builder&&builder.id===t.id)builder=null;save();drawTestItems(b);drawBuilder(b);toast('Тест удалён')})});
}
function newBuilder(){return{id:null,title:'',questions:[{q:'',options:['',''],correct:0}]}}
function drawBuilder(b){
  if(!builder)builder=newBuilder();const B=builder;
  $('#builder').innerHTML=`<div class="stack" style="gap:14px">
    <div class="eyebrow">${B.id?'Редактирование теста':'Новый тест'}</div>
    <div class="field"><label for="bt-title">Название теста</label><input class="input" id="bt-title" value="${esc(B.title)}" placeholder="Например, Проверка понимания: глава 2"></div>
    ${B.questions.map((q,i)=>`<div class="qb" data-i="${i}"><div class="qb-head"><b>Вопрос ${i+1}</b>${B.questions.length>1?`<button type="button" class="btn sm ghost" data-rq>Удалить вопрос</button>`:''}</div>
      <input class="input" data-q id="bq-${i}" value="${esc(q.q)}" placeholder="Текст вопроса">
      <div class="hint" style="color:var(--muted);font-size:12.5px">Отметьте кружком правильный вариант</div>
      ${q.options.map((o,j)=>`<div class="qb-opt"><input type="radio" name="bc-${i}" id="bc-${i}-${j}" ${q.correct===j?'checked':''} data-c="${j}" aria-label="Правильный ответ: вариант ${j+1}"><input class="input" data-o="${j}" id="bo-${i}-${j}" value="${esc(o)}" placeholder="Вариант ${j+1}">${q.options.length>2?`<button type="button" class="btn sm ghost" data-ro="${j}" aria-label="Удалить вариант">×</button>`:''}</div>`).join('')}
      ${q.options.length<6?`<button type="button" class="btn sm ghost" data-ao style="justify-self:start">+ Вариант ответа</button>`:''}</div>`).join('')}
    <button type="button" class="btn" id="addQ" style="justify-self:start">+ Добавить вопрос</button>
    <div class="form-actions" style="margin-top:0"><span class="status" id="bst"></span>${B.id?'<button type="button" class="btn ghost" id="bcancel">Отмена</button>':''}<button type="button" class="btn primary" id="bsave">${B.id?'Сохранить тест':'Создать тест'}</button></div></div>`;
  const sync=()=>{B.title=$('#bt-title').value;$$('.qb').forEach(el=>{const q=B.questions[+el.dataset.i];q.q=$('[data-q]',el).value;$$('[data-o]',el).forEach(o=>q.options[+o.dataset.o]=o.value);const c=$('[data-c]:checked',el);if(c)q.correct=+c.dataset.c})};
  $$('.qb').forEach(el=>{const i=+el.dataset.i,q=B.questions[i];
    el.querySelector('[data-rq]')?.addEventListener('click',()=>{sync();B.questions.splice(i,1);drawBuilder(b)});
    el.querySelector('[data-ao]')?.addEventListener('click',()=>{sync();q.options.push('');drawBuilder(b);$(`#bo-${i}-${q.options.length-1}`).focus()});
    $$('[data-ro]',el).forEach(x=>x.onclick=()=>{sync();const j=+x.dataset.ro;q.options.splice(j,1);if(q.correct>=q.options.length||q.correct===j)q.correct=0;else if(q.correct>j)q.correct--;drawBuilder(b)})});
  $('#addQ').onclick=()=>{sync();B.questions.push({q:'',options:['',''],correct:0});drawBuilder(b);$(`#bq-${B.questions.length-1}`).focus()};
  $('#bcancel')?.addEventListener('click',()=>{builder=null;drawBuilder(b)});
  $('#bsave').onclick=()=>{sync();const st=$('#bst');st.classList.add('err');
    if(!B.title.trim()){st.textContent='Введите название теста.';return}
    for(let i=0;i<B.questions.length;i++){const q=B.questions[i];if(!q.q.trim()){st.textContent=`Вопрос ${i+1}: введите текст вопроса.`;return}
      if(q.options.some(o=>!o.trim())){st.textContent=`Вопрос ${i+1}: заполните все варианты или удалите пустые.`;return}}
    const clean={id:B.id||uid('x'),title:B.title.trim(),questions:B.questions.map(q=>({q:q.q.trim(),options:q.options.map(o=>o.trim()),correct:q.correct}))};
    const idx=b.tests.findIndex(x=>x.id===clean.id);if(idx>=0)b.tests[idx]=clean;else b.tests.push(clean);
    if(prefs.results[clean.id]){delete prefs.results[clean.id];savePrefs()}
    save();toast(idx>=0?'Тест сохранён':'Тест создан');builder=null;drawTestItems(b);drawBuilder(b)};
}

renderLangSeg();route();
</script>
